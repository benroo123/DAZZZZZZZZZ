    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create an event subscription and return the secret once
      x-risk-level: high
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '201': { $ref: '#/components/responses/OkObject' }
  /webhooks/{webhook_id}:
    parameters:
      - name: webhook_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update event subscription or pause delivery
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete an event subscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
