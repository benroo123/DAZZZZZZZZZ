      summary: Future - create an activity fee order through a licensed provider
      deprecated: true
      x-risk-level: critical
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /orders/{order_id}:
    get:
      tags: [PaymentsFuture]
      operationId: getOrder
      summary: Future - get order state
      deprecated: true
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /orders/{order_id}/pay:
    post:
      tags: [PaymentsFuture]
      operationId: payOrder
      summary: Future - initiate payment with a licensed provider
      deprecated: true
      x-risk-level: critical
      x-agent-approval: always
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '501': { $ref: '#/components/responses/Error' }
  /orders/{order_id}/refunds:
    post:
      tags: [PaymentsFuture]
      operationId: requestRefund
      summary: Future - request a refund
      deprecated: true
      x-risk-level: critical
      x-agent-approval: always
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '501': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 12, maxLength: 120 }
    AgentPrincipal:
      name: X-Agent-Principal
      in: header
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
    DryRun:
      name: dry_run
      in: query
      required: false
      schema: { type: boolean, default: false }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PhotoId:
      name: photo_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PostId:
      name: post_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActivityId:
      name: activity_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FeedMode:
      name: mode
      in: query
      required: false
      schema: { type: string, enum: [recommended, city], default: recommended }
    CityCode:
      name: city_code
      in: query
      required: false
      schema: { type: string, maxLength: 20 }
    Latitude:
      name: lat
      in: query
      required: false
      schema: { type: number, minimum: -90, maximum: 90 }
    Longitude:
      name: lng
      in: query
      required: false
      schema: { type: number, minimum: -180, maximum: 180 }
    RadiusKm:
      name: radius_km
      in: query
      required: false
      schema: { type: number, minimum: 1, maximum: 100, default: 5 }
  requestBodies:
    FreeformCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    OkObject:
      description: Successful response
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    OkPage:
      description: Cursor page
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Page' }
    CommandResult:
      description: Command result or dry-run preview
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CommandResult' }
    Accepted:
      description: Accepted for asynchronous processing
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AsyncJob' }
    NoContent:
      description: Successful response with no body
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
    Error:
      description: Typed error
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Error' }
  headers:
    CorrelationId:
      description: Request correlation ID
      schema: { $ref: '#/components/schemas/Uuid' }
  schemas:
    Uuid:
      type: string
      format: uuid
    Page:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    Error:
      type: object
      required: [code, message, correlation_id, retryable]
      properties:
        code: { type: string, examples: [ACTIVITY_FULL] }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        correlation_id: { $ref: '#/components/schemas/Uuid' }
        retryable: { type: boolean }
        suggested_actions:
          type: array
          items: { type: string }
    OtpRequest:
      type: object
      required: [phone, purpose, challenge_token]
      properties:
        phone: { type: string, pattern: '^\\+?[1-9][0-9]{7,14}$' }
        purpose: { type: string, enum: [login, bind_phone, high_risk_action] }
        challenge_token: { type: string }
    OtpVerifyRequest:
      type: object
      required: [phone, code, device]
      properties:
        phone: { type: string }
        code: { type: string, pattern: '^[0-9]{4,8}$' }
        device:
          type: object
          required: [platform, fingerprint]
          properties:
            platform: { type: string, enum: [ios, android] }
            fingerprint: { type: string, maxLength: 256 }
            app_version: { type: string }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in, user_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, examples: [900] }
        user_id: { $ref: '#/components/schemas/Uuid' }
    MediaRef:
      type: object
      required: [id, url, ai_generated, moderation_status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        ai_generated: { type: boolean }
        ai_label: { type: [string, 'null'], examples: [AI generated content] }
        moderation_status: { type: string, enum: [pending, approved, rejected, quarantined] }
    UserCard:
      type: object
      required: [id, public_id, display_name, real_name_status, photos, capabilities]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        public_id: { type: string }
        display_name: { type: string, maxLength: 40 }
        age: { type: [integer, 'null'], minimum: 18 }
        real_name_status: { type: string, enum: [unverified, verified] }
        distance_km: { type: [number, 'null'], description: Rounded distance only }
        bio: { type: [string, 'null'] }
        interests: { type: array, items: { type: string } }
        photos: { type: array, items: { $ref: '#/components/schemas/MediaRef' } }
        capabilities: { type: array, items: { type: string } }
    Profile:
      allOf:
        - $ref: '#/components/schemas/UserCard'
        - type: object
          properties:
            birth_date: { type: [string, 'null'], format: date }
            city_code: { type: [string, 'null'] }
            district_code: { type: [string, 'null'] }
            occupation: { type: [string, 'null'] }
            availability: { type: object, additionalProperties: true }
            field_visibility: { type: object, additionalProperties: true }
            completion_percent: { type: integer, minimum: 0, maximum: 100 }
            version: { type: integer, minimum: 1 }
    ProfilePatch:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 40 }
        birth_date: { type: string, format: date }
        bio: { type: string, maxLength: 500 }
        city_code: { type: string, maxLength: 20 }
        district_code: { type: string, maxLength: 20 }
        occupation: { type: string, maxLength: 80 }
        personality_label: { type: string, maxLength: 32 }
        availability: { type: object, additionalProperties: true }
        field_visibility: { type: object, additionalProperties: true }
    ActivitySummary:
      type: object
      required: [id, title, category, starts_at, status, min_participants, max_participants, approved_count, media, capabilities]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        category: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string }
        city_code: { type: string }
        district_code: { type: [string, 'null'] }
        distance_km: { type: [number, 'null'] }
        min_participants: { type: integer, minimum: 2, maximum: 50 }
        max_participants: { type: integer, minimum: 2, maximum: 50 }
        approved_count: { type: integer, minimum: 0, maximum: 50 }
        media: { type: array, items: { $ref: '#/components/schemas/MediaRef' } }
        organizer: { $ref: '#/components/schemas/UserCard' }
        capabilities: { type: array, items: { type: string } }
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivitySummary'
        - type: object
          required: [description, join_policy, version]
          properties:
            description: { type: string }
            join_policy: { type: string, enum: [open, approval, invite_only] }
            application_deadline: { type: [string, 'null'], format: date-time }
            venue_name: { type: [string, 'null'] }
            public_location: { $ref: '#/components/schemas/GeoPoint' }
            exact_location_available: { type: boolean }
            cost_type: { type: string, enum: [free, aa, fixed, organizer_pays] }
            cost_amount_cents: { type: [integer, 'null'], minimum: 0 }
            currency: { type: string, minLength: 3, maxLength: 3 }
            membership: { oneOf: [{ $ref: '#/components/schemas/ActivityMembership' }, { type: 'null' }] }
            version: { type: integer, minimum: 1 }
    ActivityInput:
      type: object
      required: [title, description, category, media_ids, starts_at, ends_at, city_code, min_participants, max_participants, join_policy]
      properties:
        title: { type: string, minLength: 4, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        category: { type: string, maxLength: 60 }
        media_ids:
          type: array
          minItems: 1
          maxItems: 9
          items: { $ref: '#/components/schemas/Uuid' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        application_deadline: { type: [string, 'null'], format: date-time }
        city_code: { type: string, maxLength: 20 }
        district_code: { type: [string, 'null'], maxLength: 20 }
        venue_name: { type: [string, 'null'], maxLength: 120 }
        public_location: { $ref: '#/components/schemas/GeoPoint' }
        exact_location_envelope: { type: [string, 'null'], description: Client-to-service encrypted exact location }
        min_participants: { type: integer, minimum: 2, maximum: 50 }
        max_participants: { type: integer, minimum: 2, maximum: 50 }
        join_policy: { type: string, enum: [open, approval, invite_only] }
        waitlist_enabled: { type: boolean, default: true }
        cost_type: { type: string, enum: [free, aa, fixed, organizer_pays], default: free }
        cost_amount_cents: { type: [integer, 'null'], minimum: 0 }
    ActivityPatch:
      type: object
      description: Partial ActivityInput; server applies status-dependent edit rules.
      minProperties: 1
      properties:
        title: { type: string, minLength: 4, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        category: { type: string, maxLength: 60 }
        media_ids: { type: array, minItems: 1, maxItems: 9, items: { $ref: '#/components/schemas/Uuid' } }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        application_deadline: { type: [string, 'null'], format: date-time }
        city_code: { type: string, maxLength: 20 }
        district_code: { type: [string, 'null'], maxLength: 20 }
        venue_name: { type: [string, 'null'], maxLength: 120 }
        public_location: { $ref: '#/components/schemas/GeoPoint' }
        min_participants: { type: integer, minimum: 2, maximum: 50 }
        max_participants: { type: integer, minimum: 2, maximum: 50 }
        join_policy: { type: string, enum: [open, approval, invite_only] }
        waitlist_enabled: { type: boolean }
    ActivityMembership:
      type: object
      required: [activity_id, user_id, status, role, updated_at]
      properties:
        activity_id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [applied, waitlisted, approved, joined, rejected, cancelled, removed, checked_in, completed, no_show] }
        role: { type: string, enum: [organizer, cohost, participant] }
        updated_at: { type: string, format: date-time }
    JoinActivityRequest:
      type: object
      properties:
        application_note: { type: string, maxLength: 500 }
        accept_rules: { type: boolean }
    GeoPoint:
      type: object
      required: [lat, lng, coordinate_system]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        coordinate_system: { type: string, enum: [WGS84, GCJ02, BD09] }
    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ActivityFeedItem'
              - $ref: '#/components/schemas/PostFeedItem'
            discriminator:
              propertyName: entity_type
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    ActivityFeedItem:
      type: object
      required: [entity_type, entity, reason_code, impression_id]
      properties:
        entity_type: { type: string, const: activity }
        entity: { $ref: '#/components/schemas/ActivitySummary' }
        reason_code: { type: string }
        impression_id: { $ref: '#/components/schemas/Uuid' }
    PostFeedItem:
      type: object
      required: [entity_type, entity, reason_code, impression_id]
      properties:
        entity_type: { type: string, const: post }
        entity: { type: object, additionalProperties: true }
        reason_code: { type: string }
        impression_id: { $ref: '#/components/schemas/Uuid' }
    MediaUploadRequest:
      type: object
      required: [purpose, filename, mime_type, byte_size, sha256]
      properties:
        purpose: { type: string, enum: [profile, post, activity, message] }
        filename: { type: string, maxLength: 180 }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byte_size: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    AiGenerationRequest:
      type: object
      required: [purpose, source_text]
      properties:
        purpose: { type: string, enum: [activity_cover, post_cover, summary] }
        source_text: { type: string, minLength: 1, maxLength: 5000 }
        style: { type: string, maxLength: 80 }
        reference_media_ids: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/Uuid' } }
        aspect_ratio: { type: string, enum: ['1:1', '4:3', '3:4', '16:9'], default: '4:3' }
    PostInput:
      type: object
      required: [body, media_ids]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        media_ids: { type: array, minItems: 1, maxItems: 9, items: { $ref: '#/components/schemas/Uuid' } }
        visibility: { type: string, enum: [public, followers, activity_members, private], default: public }
        city_code: { type: [string, 'null'] }
    SwipeRequest:
      type: object
      required: [target_user_id, decision]
      properties:
        target_user_id: { $ref: '#/components/schemas/Uuid' }
        decision: { type: string, enum: [pass, like, super_like] }
        context_activity_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    SendMessageRequest:
      type: object
      required: [client_message_id, type]
      properties:
        client_message_id: { type: string, minLength: 8, maxLength: 80 }
        type: { type: string, enum: [text, image, activity_card, location] }
        text: { type: [string, 'null'], maxLength: 5000 }
        media_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        activity_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        location: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
    ReportRequest:
      type: object
      required: [target_type, target_id, reason_code]
      properties:
        target_type: { type: string, enum: [user, post, comment, activity, message, conversation] }
        target_id: { $ref: '#/components/schemas/Uuid' }
        reason_code: { type: string, maxLength: 60 }
        details: { type: [string, 'null'], maxLength: 1000 }
        evidence_media_ids: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Uuid' } }
        protective_block: { type: boolean, default: false }
    ClientEvent:
      type: object
      required: [event_id, name, occurred_at]
      properties:
        event_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 80 }
        occurred_at: { type: string, format: date-time }
        entity_type: { type: [string, 'null'] }
        entity_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        impression_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        properties: { type: object, additionalProperties: true }
    CommandResult:
      type: object
      required: [status, dry_run, approval_required, correlation_id]
      properties:
        status: { type: string, enum: [preview, succeeded, accepted, denied] }
        dry_run: { type: boolean }
        approval_required: { type: boolean }
        approval_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        resource: { type: object, additionalProperties: true }
        proposed_changes: { type: array, items: { type: object, additionalProperties: true } }
        policy_findings: { type: array, items: { type: object, additionalProperties: true } }
        event_id: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        audit_ref: { type: [string, 'null'] }
        correlation_id: { $ref: '#/components/schemas/Uuid' }
    AsyncJob:
      type: object
      required: [job_id, status, status_url]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, awaiting_approval] }
        status_url: { type: string, format: uri-reference }
    AgentRunRequest:
      type: object
      required: [goal, on_behalf_of]
      properties:
        goal: { type: string, minLength: 1, maxLength: 1000 }
        on_behalf_of: { $ref: '#/components/schemas/Uuid' }
        constraints: { type: object, additionalProperties: true }
        max_actions: { type: integer, minimum: 1, maximum: 50, default: 10 }
        expires_at: { type: string, format: date-time }
    AgentActionRequest:
      type: object
      required: [operation_id, arguments, dry_run]
      properties:
        operation_id: { type: string, minLength: 1, maxLength: 120 }
        arguments: { type: object, additionalProperties: true }
        dry_run: { type: boolean }
        expected_resource_version: { type: [integer, 'null'] }
    AgentActionResult:
      allOf:
        - $ref: '#/components/schemas/CommandResult'
        - type: object
          required: [action_id]
          properties:
            action_id: { $ref: '#/components/schemas/Uuid' }
            operation_id: { type: string }
            risk_level: { type: string, enum: [low, medium, high, critical] }
    ApprovalDecision:
      type: object
      required: [decision, action_digest]
      properties:
        decision: { type: string, enum: [approve, deny] }
        action_digest: { type: string, description: Hash of the immutable action snapshot }
        reason: { type: [string, 'null'], maxLength: 500 }
