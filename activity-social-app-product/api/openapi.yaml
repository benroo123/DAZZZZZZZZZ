openapi: 3.1.0
info:
  title: Dachang Activity Social API
  version: 0.1.0
  description: >-
    Mobile-first activity social API. Stable operationId values are also Agent tool identifiers.
    High-risk mutations support dry-run, idempotency and human approval.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
tags:
  - { name: System }
  - { name: Auth }
  - { name: Identity }
  - { name: Profile }
  - { name: Social }
  - { name: Discovery }
  - { name: Media }
  - { name: AI }
  - { name: Posts }
  - { name: Activities }
  - { name: Matching }
  - { name: Messaging }
  - { name: Notifications }
  - { name: Safety }
  - { name: DataRights }
  - { name: Agent }
  - { name: Webhooks }
  - { name: PaymentsFuture }
paths:
  /system/config:
    get:
      tags: [System]
      operationId: getSystemConfig
      summary: Get mobile feature flags, minimum versions and AI disclosure
      security: []
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
  /system/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200': { $ref: '#/components/responses/OkObject' }

  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request an SMS one-time password
      security: []
      x-risk-level: medium
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify OTP and issue rotating tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/token/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 20 }
      responses:
        '200':
          description: Refreshed tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current device session
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List signed-in devices
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /auth/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke a device session
      x-risk-level: high
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /identity/real-name/sessions:
    post:
      tags: [Identity]
      operationId: createRealNameSession
      summary: Create a vendor-hosted real-name verification session
      x-risk-level: critical
      x-agent-approval: always
      responses:
        '201': { $ref: '#/components/responses/OkObject' }
  /identity/real-name/status:
    get:
      tags: [Identity]
      operationId: getRealNameStatus
      summary: Get verification result without identity source values
      responses:
        '200': { $ref: '#/components/responses/OkObject' }

  /me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Get the authenticated user's full profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Update profile fields and field visibility
      x-risk-level: medium
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '409': { $ref: '#/components/responses/Error' }
  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Profile]
      operationId: getUserProfile
      summary: Get a visibility-filtered user profile
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCard' }
        '404': { $ref: '#/components/responses/Error' }
  /users/by-public-id/{public_id}:
    get:
      tags: [Profile]
      operationId: getUserByPublicId
      summary: Find a user by opt-in public ID
      parameters:
        - name: public_id
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
        '404': { $ref: '#/components/responses/Error' }
  /me/photos:
    post:
      tags: [Profile]
      operationId: addProfilePhoto
      summary: Attach an approved media asset to the profile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id, position]
              properties:
                media_id: { $ref: '#/components/schemas/Uuid' }
                position: { type: integer, minimum: 0, maximum: 5 }
                is_primary: { type: boolean, default: false }
      responses:
        '201': { $ref: '#/components/responses/OkObject' }
  /me/photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    patch:
      tags: [Profile]
      operationId: updateProfilePhoto
      summary: Reorder or set the primary profile photo
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    delete:
      tags: [Profile]
      operationId: deleteProfilePhoto
      summary: Delete a profile photo association
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /interests:
    get:
      tags: [Profile]
      operationId: listInterests
      summary: List active interest taxonomy
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /me/interests:
    put:
      tags: [Profile]
      operationId: replaceMyInterests
      summary: Replace interest choices atomically
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
  /me/preferences/match:
    get:
      tags: [Profile]
      operationId: getMatchPreferences
      summary: Get match preferences
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    patch:
      tags: [Profile]
      operationId: updateMatchPreferences
      summary: Update match preferences
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
  /me/privacy:
    get:
      tags: [Profile]
      operationId: getPrivacySettings
      summary: Get privacy and recommendation controls
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    patch:
      tags: [Profile]
      operationId: updatePrivacySettings
      summary: Update privacy, personalization and Agent data controls
      x-risk-level: high
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }

  /users/{user_id}/follow:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Social]
      operationId: followUser
      summary: Follow a user
      x-risk-level: medium
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
    delete:
      tags: [Social]
      operationId: unfollowUser
      summary: Unfollow a user
      x-risk-level: medium
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /me/follows:
    get:
      tags: [Social]
      operationId: listFollowing
      summary: List followed users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /me/followers:
    get:
      tags: [Social]
      operationId: listFollowers
      summary: List followers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /users/{user_id}/block:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Social]
      operationId: blockUser
      summary: Block a user across discovery, activities and messaging
      x-risk-level: high
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [standard, silent], default: standard }
                reason_code: { type: string, maxLength: 40 }
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
    delete:
      tags: [Social]
      operationId: unblockUser
      summary: Remove a user block
      x-risk-level: high
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /me/blocks:
    get:
      tags: [Social]
      operationId: listBlockedUsers
      summary: List blocked users
      responses:
        '200': { $ref: '#/components/responses/OkPage' }

  /feed:
    get:
      tags: [Discovery]
      operationId: getHomeFeed
      summary: Get a mixed activity and post feed
      parameters:
        - $ref: '#/components/parameters/FeedMode'
        - $ref: '#/components/parameters/CityCode'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Mixed feed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
  /search:
    get:
      tags: [Discovery]
      operationId: searchEntities
      summary: Search activities, places, names, posts and people
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: types
          in: query
          schema:
            type: array
            items: { type: string, enum: [activity, place, post, user] }
          style: form
          explode: false
        - $ref: '#/components/parameters/CityCode'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /search/suggestions:
    get:
      tags: [Discovery]
      operationId: getSearchSuggestions
      summary: Get typeahead suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /activities/nearby:
    get:
      tags: [Discovery, Activities]
      operationId: listNearbyActivities
      summary: Filter nearby activities by type, place, distance, time and people
      parameters:
        - $ref: '#/components/parameters/CityCode'
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - $ref: '#/components/parameters/RadiusKm'
        - name: categories
          in: query
          schema: { type: array, items: { type: string }, maxItems: 10 }
          style: form
          explode: false
        - name: starts_after
          in: query
          schema: { type: string, format: date-time }
        - name: starts_before
          in: query
          schema: { type: string, format: date-time }
        - name: participant_min
          in: query
          schema: { type: integer, minimum: 2, maximum: 50 }
        - name: participant_max
          in: query
          schema: { type: integer, minimum: 2, maximum: 50 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
  /events/batch:
    post:
      tags: [Discovery]
      operationId: ingestClientEvents
      summary: Ingest consent-aware exposure and conversion events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/ClientEvent' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }

  /media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Create a direct upload session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadRequest' }
      responses:
        '201': { $ref: '#/components/responses/OkObject' }
  /media/uploads/{upload_id}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Complete upload and start scanning and moderation
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /media/{media_id}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [Media]
      operationId: getMediaAsset
      summary: Get media processing status and a short-lived URL
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    delete:
      tags: [Media]
      operationId: deleteMediaAsset
      summary: Delete an unreferenced media asset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /ai/generations:
    post:
      tags: [AI]
      operationId: createAiGeneration
      summary: Create an AI cover or summary job
      x-risk-level: medium
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiGenerationRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /ai/generations/{job_id}:
    get:
      tags: [AI]
      operationId: getAiGeneration
      summary: Get generation status and provenance
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
  /ai/generations/{job_id}/confirm:
    post:
      tags: [AI]
      operationId: confirmAiGeneration
      summary: Confirm a specific generated asset for later publication
      x-risk-level: high
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
  /ai/generations/{job_id}/cancel:
    post:
      tags: [AI]
      operationId: cancelAiGeneration
      summary: Cancel a generation job
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }

  /posts:
    post:
      tags: [Posts]
      operationId: createPost
      summary: Create a post draft with at least one media asset
      x-risk-level: medium
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201': { $ref: '#/components/responses/OkObject' }
  /posts/{post_id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Posts]
      operationId: getPost
      summary: Get a post
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    patch:
      tags: [Posts]
      operationId: updatePost
      summary: Update a draft or editable post
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: Delete a post
      x-risk-level: high
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /posts/{post_id}/publish:
    post:
      tags: [Posts]
      operationId: publishPost
      summary: Publish a post after moderation and AI-label validation
      x-risk-level: high
      x-agent-approval: conditional
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DryRun'
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
        '202': { $ref: '#/components/responses/Accepted' }
  /posts/{post_id}/reactions/{reaction}:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: reaction
        in: path
        required: true
        schema: { type: string, enum: [like] }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Posts]
      operationId: reactToPost
      summary: Add a post reaction
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
    delete:
      tags: [Posts]
      operationId: removePostReaction
      summary: Remove a post reaction
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /posts/{post_id}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Posts]
      operationId: listComments
      summary: List post comments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/OkPage' }
    post:
      tags: [Posts]
      operationId: createComment
      summary: Create a comment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '201': { $ref: '#/components/responses/OkObject' }
  /comments/{comment_id}:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    patch:
      tags: [Posts]
      operationId: updateComment
      summary: Update own comment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/OkObject' }
    delete:
      tags: [Posts]
      operationId: deleteComment
      summary: Delete own comment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /activities:
    post:
      tags: [Activities]
      operationId: createActivity
      summary: Create an activity draft for 2 to 50 participants
      x-risk-level: medium
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInput' }
      responses:
        '201':
          description: Activity draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '422': { $ref: '#/components/responses/Error' }
  /activities/{activity_id}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [Activities]
      operationId: getActivity
      summary: Get activity with viewer-specific capabilities
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
    patch:
      tags: [Activities]
      operationId: updateActivity
      summary: Update draft or allowed activity fields
      x-risk-level: high
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityPatch' }
      responses:
        '200':
          description: Updated activity or preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Activities]
      operationId: deleteActivity
      summary: Delete an unpublished activity draft
      x-risk-level: high
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
  /activities/{activity_id}/publish:
    post:
      tags: [Activities]
      operationId: publishActivity
      summary: Publish an activity after policy evaluation
      x-risk-level: high
      x-agent-approval: conditional
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DryRun'
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
        '202': { $ref: '#/components/responses/Accepted' }
  /activities/{activity_id}/cancel:
    post:
      tags: [Activities]
      operationId: cancelActivity
      summary: Cancel activity and notify affected members
      x-risk-level: high
      x-agent-approval: always
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DryRun'
      requestBody: { $ref: '#/components/requestBodies/FreeformCommand' }
      responses:
        '200': { $ref: '#/components/responses/CommandResult' }
  /activities/{activity_id}/join:
    post:
      tags: [Activities]
      operationId: joinActivity
      summary: Apply, join directly, or enter the waitlist atomically
      x-risk-level: high
      x-agent-approval: conditional
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: false
        content:
          application/json:
