      x-risk-level: high
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OkObject' }

  /activities/{activity_id}/orders:
