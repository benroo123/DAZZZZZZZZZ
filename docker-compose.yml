name: dachang-local

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: dachang
      POSTGRES_USER: dachang
      POSTGRES_PASSWORD: dachang
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./activity-social-app-product/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./infra/db/002-runtime.sql:/docker-entrypoint-initdb.d/002-runtime.sql:ro
      - ./infra/db/003-seed.sql:/docker-entrypoint-initdb.d/003-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dachang -d dachang"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dachang
      RABBITMQ_DEFAULT_PASS: dachang
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dachang
      MINIO_ROOT_PASSWORD: dachang-local-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-ts:
    profiles: ["full"]
    build:
      context: .
      dockerfile: services/api-ts/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://dachang:dachang@postgres:5432/dachang
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://dachang:dachang@rabbitmq:5672
      S3_ENDPOINT: minio
      S3_PORT: 9000
      TS_PUBLIC_BASE_URL: http://127.0.0.1:3100
    ports:
      - "3100:3100"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker-ts:
    profiles: ["full"]
    build:
      context: .
      dockerfile: services/api-ts/Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://dachang:dachang@postgres:5432/dachang
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://dachang:dachang@rabbitmq:5672
      S3_ENDPOINT: minio
      S3_PORT: 9000
    depends_on:
      api-ts: { condition: service_started }

  api-python:
    profiles: ["python"]
    build:
      context: .
      dockerfile: services/api-python/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://dachang:dachang@postgres:5432/dachang
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://dachang:dachang@rabbitmq:5672
      S3_ENDPOINT: minio
      S3_PORT: 9000
      PY_PUBLIC_BASE_URL: http://127.0.0.1:8100
    ports:
      - "8100:8100"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker-python:
    profiles: ["python"]
    build:
      context: .
      dockerfile: services/api-python/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://dachang:dachang@postgres:5432/dachang
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://dachang:dachang@rabbitmq:5672
      S3_ENDPOINT: minio
      S3_PORT: 9000
    depends_on:
      api-python: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
