[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dachang-api-python"
version = "0.1.0"
description = "FastAPI implementation of the DAZZZZZZZZZ runtime contract"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.123,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "pika>=1.3,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.12,<3",
  "redis>=6,<7",
  "uvicorn[standard]>=0.38,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
